<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>醫師簽名</title>
  <link rel="stylesheet" href="/assets/app.css">
</head>
<body>
  <div class="app-shell sign-layout">
    <header class="topbar">
      <img class="sign-logo" src="/assets/nordberg-medical-logo-dark.png" alt="Nordberg Medical">
      <div class="status-pill" aria-live="polite">
        <span class="status-dot" id="connectionDot"></span>
        <span id="connectionText">連線中</span>
      </div>
    </header>

    <main class="signature-area">
      <section class="signature-card">
        <header>
          <div>
            <h1>請在此簽名</h1>
            <p id="message">落筆會直播到電視牆；停筆後自動完成。</p>
          </div>
          <div class="signature-header-actions">
            <span class="status-pill"><span id="pointCount">0</span> points</span>
            <button type="button" class="primary" id="retryButton" hidden>重送</button>
            <button type="button" class="secondary" id="clearButton">清除</button>
          </div>
        </header>
        <div class="canvas-wrap">
          <canvas id="signatureCanvas"></canvas>
          <div class="placeholder" id="placeholder">SIGN</div>
        </div>
      </section>
    </main>

  </div>

  <script type="module">
    import { connectEvents, setDot, signHeaders } from "/assets/shared.js";

    const canvas = document.querySelector("#signatureCanvas");
    const ctx = canvas.getContext("2d");
    const placeholder = document.querySelector("#placeholder");
    const clearButton = document.querySelector("#clearButton");
    const retryButton = document.querySelector("#retryButton");
    const message = document.querySelector("#message");
    const pointCount = document.querySelector("#pointCount");
    const connectionDot = document.querySelector("#connectionDot");
    const connectionText = document.querySelector("#connectionText");

    let strokes = [];
    let activeStroke = null;
    let drawing = false;
    let liveSignatureId = "";
    let liveFrame = 0;
    let liveDirty = false;
    let liveRequestInFlight = false;
    let liveAbortController = null;
    let finalizeTimer = null;
    // While a finished signature is being delivered the canvas is locked: a new
    // pen-down can neither merge into it nor be wiped by the success reset.
    let finalizing = false;
    let delivering = false;
    let pendingSubmission = "";
    // Bumped by 清除 so an abandoned delivery loop stops touching the page.
    let submitGeneration = 0;
    const autoFinalizeDelayMs = 1300;
    const submitTimeoutMs = 8000;
    const retryDelaysMs = [1000, 2000, 4000, 8000];

    function resizeCanvas() {
      const rect = canvas.getBoundingClientRect();
      const ratio = window.devicePixelRatio || 1;
      canvas.width = Math.max(1, Math.floor(rect.width * ratio));
      canvas.height = Math.max(1, Math.floor(rect.height * ratio));
      ctx.setTransform(ratio, 0, 0, ratio, 0, 0);
      ctx.lineCap = "round";
      ctx.lineJoin = "round";
      redraw();
    }

    function round(value, digits) {
      const factor = 10 ** digits;
      return Math.round(value * factor) / factor;
    }

    function getPoint(event) {
      const rect = canvas.getBoundingClientRect();
      const x = (event.clientX - rect.left) / rect.width;
      const y = (event.clientY - rect.top) / rect.height;
      return {
        x: round(Math.min(1, Math.max(0, x)), 4),
        y: round(Math.min(1, Math.max(0, y)), 4),
        p: round(event.pressure || 0.5, 2)
      };
    }

    function drawStroke(stroke) {
      const rect = canvas.getBoundingClientRect();
      if (stroke.length < 2) return;
      ctx.beginPath();
      ctx.strokeStyle = "#171a20";
      ctx.lineWidth = 4;
      for (let i = 0; i < stroke.length; i += 1) {
        const point = stroke[i];
        const x = point.x * rect.width;
        const y = point.y * rect.height;
        if (i === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      }
      ctx.stroke();
    }

    function redraw() {
      const rect = canvas.getBoundingClientRect();
      ctx.clearRect(0, 0, rect.width, rect.height);
      for (const stroke of strokes) drawStroke(stroke);
      const points = totalPoints();
      pointCount.textContent = String(points);
      placeholder.style.display = points > 0 ? "none" : "grid";
    }

    canvas.addEventListener("pointerdown", (event) => {
      event.preventDefault();
      if (finalizing) return;
      cancelAutoFinalize();
      ensureLiveSignatureId();
      drawing = true;
      activeStroke = [getPoint(event)];
      strokes.push(activeStroke);
      canvas.setPointerCapture(event.pointerId);
      redraw();
      pushLiveSignature(true);
    });

    canvas.addEventListener("pointermove", (event) => {
      if (!drawing || !activeStroke) return;
      event.preventDefault();
      activeStroke.push(getPoint(event));
      redraw();
      pushLiveSignature();
    });

    function finishStroke(event) {
      if (!drawing) return;
      event.preventDefault();
      drawing = false;
      activeStroke = null;
      redraw();
      pushLiveSignature(true);
      scheduleAutoFinalize();
    }

    canvas.addEventListener("pointerup", finishStroke);
    canvas.addEventListener("pointercancel", finishStroke);

    clearButton.addEventListener("click", () => {
      cancelAutoFinalize();
      cancelLiveFlush();
      submitGeneration += 1;
      finalizing = false;
      pendingSubmission = "";
      retryButton.hidden = true;
      strokes = [];
      activeStroke = null;
      drawing = false;
      clearLiveSignature();
      liveSignatureId = "";
      message.textContent = "已清除，可以重新簽名。";
      redraw();
    });

    retryButton.addEventListener("click", () => {
      if (pendingSubmission) deliver();
    });

    function ensureLiveSignatureId() {
      if (!liveSignatureId) {
        liveSignatureId = `sig-${Date.now()}-${Math.round(Math.random() * 10000)}`;
      }
    }

    function totalPoints() {
      return strokes.reduce((sum, stroke) => sum + stroke.length, 0);
    }

    function makePayload() {
      const rect = canvas.getBoundingClientRect();
      ensureLiveSignatureId();
      return {
        id: liveSignatureId,
        canvas: { width: rect.width, height: rect.height },
        strokes,
        meta: {
          doctorName: "",
          source: "ipad-sign-page",
          userAgent: navigator.userAgent
        }
      };
    }

    function describeError(status, error) {
      if (status === 403) return "這台 iPad 沒有簽名權限，請用控制台的簽名頁連結重新開啟";
      return error || `HTTP ${status}`;
    }

    function pushLiveSignature(immediate = false) {
      if (totalPoints() < 1 || finalizing) return;
      liveDirty = true;
      if (immediate) flushLiveSignature();
      else scheduleLiveFlush();
    }

    function scheduleLiveFlush() {
      if (liveFrame || finalizing) return;
      liveFrame = requestAnimationFrame(() => {
        liveFrame = 0;
        flushLiveSignature();
      });
    }

    function cancelLiveFlush() {
      if (liveFrame) {
        cancelAnimationFrame(liveFrame);
        liveFrame = 0;
      }
      liveDirty = false;
      if (liveAbortController) {
        liveAbortController.abort();
        liveAbortController = null;
      }
    }

    function flushLiveSignature() {
      if (!liveDirty || totalPoints() < 1 || finalizing) return;
      if (liveRequestInFlight) return;
      liveDirty = false;
      sendLiveSignature();
    }

    async function sendLiveSignature() {
      if (totalPoints() < 1 || finalizing || liveRequestInFlight) return;
      liveRequestInFlight = true;
      liveAbortController = new AbortController();
      try {
        const response = await fetch("/api/live-signature", {
          method: "POST",
          headers: { "Content-Type": "application/json", ...signHeaders() },
          body: JSON.stringify(makePayload()),
          signal: liveAbortController.signal
        });
        // 409: this signature was already submitted; the frame is just late.
        if (response.ok) {
          message.textContent = drawing ? "正在同步到電視牆..." : "停筆中，準備自動完成...";
        } else if (response.status !== 409) {
          const payload = await response.json().catch(() => ({}));
          message.textContent = `同步失敗：${describeError(response.status, payload.error)}`;
        }
      } catch (error) {
        if (error.name !== "AbortError") {
          message.textContent = `同步中斷：${error.message}`;
        }
      } finally {
        liveRequestInFlight = false;
        liveAbortController = null;
        if (liveDirty && !finalizing) scheduleLiveFlush();
      }
    }

    function scheduleAutoFinalize() {
      cancelAutoFinalize();
      if (totalPoints() < 2) return;
      finalizeTimer = setTimeout(finalizeSignature, autoFinalizeDelayMs);
    }

    function cancelAutoFinalize() {
      if (finalizeTimer) {
        clearTimeout(finalizeTimer);
        finalizeTimer = null;
      }
    }

    function finalizeSignature() {
      if (finalizing || totalPoints() < 2) return;
      finalizing = true;
      cancelLiveFlush();
      pendingSubmission = JSON.stringify(makePayload());
      deliver();
    }

    // The server stores a signature id once, so re-sending after a lost
    // response or a timeout is safe.
    async function deliver() {
      if (delivering) return;
      delivering = true;
      const generation = submitGeneration;
      retryButton.hidden = true;
      try {
        for (let attempt = 0; ; attempt += 1) {
          message.textContent = attempt === 0 ? "已完成，正在送到電視牆..." : `重新送出中（第 ${attempt} 次重試）...`;
          const result = await submitOnce(pendingSubmission);
          if (generation !== submitGeneration) return;
          if (result.ok) {
            message.textContent = "已完成，下一位可以簽名。";
            strokes = [];
            activeStroke = null;
            liveSignatureId = "";
            pendingSubmission = "";
            finalizing = false;
            redraw();
            return;
          }
          const delay = retryDelaysMs[attempt];
          if (!result.retryable || delay === undefined) {
            message.textContent = `送出失敗：${result.error}。請按「重送」，或通知工作人員。`;
            retryButton.hidden = false;
            return;
          }
          message.textContent = `送出失敗（${result.error}），${delay / 1000} 秒後自動重試...`;
          await new Promise((resolve) => setTimeout(resolve, delay));
          if (generation !== submitGeneration) return;
        }
      } finally {
        delivering = false;
      }
    }

    async function submitOnce(body) {
      const controller = new AbortController();
      const timer = setTimeout(() => controller.abort(), submitTimeoutMs);
      try {
        const response = await fetch("/api/signatures", {
          method: "POST",
          headers: { "Content-Type": "application/json", ...signHeaders() },
          body,
          signal: controller.signal
        });
        if (response.ok) return { ok: true };
        const payload = await response.json().catch(() => ({}));
        return { ok: false, retryable: response.status >= 500, error: describeError(response.status, payload.error) };
      } catch (error) {
        return { ok: false, retryable: true, error: error.name === "AbortError" ? "連線逾時" : "網路中斷" };
      } finally {
        clearTimeout(timer);
      }
    }

    async function clearLiveSignature() {
      try {
        await fetch("/api/live-signature/clear", { method: "POST", headers: signHeaders() });
      } catch {
        // The local canvas still clears even if the wall is temporarily unreachable.
      }
    }

    connectEvents("sign", {
      connection(connected) {
        setDot(connectionDot, connected);
        connectionText.textContent = connected ? "已連線" : "連線中斷";
      },
      hello() {}
    });

    window.addEventListener("resize", resizeCanvas);
    resizeCanvas();
  </script>
</body>
</html>
