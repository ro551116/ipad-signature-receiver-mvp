<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>iPad 簽名端</title>
  <link rel="stylesheet" href="/assets/app.css">
</head>
<body>
  <div class="app-shell sign-layout">
    <header class="topbar">
      <a class="brand" href="/">
        <strong>iPad 簽名端</strong>
        <span>落筆即同步到前方電視牆。</span>
      </a>
      <div class="status-pill" aria-live="polite">
        <span class="status-dot" id="connectionDot"></span>
        <span id="connectionText">連線中</span>
      </div>
    </header>

    <main class="signature-area">
      <section class="signature-card">
        <header>
          <div>
            <h1>請在此簽名</h1>
            <p id="message">落筆會直播到電視牆；停筆後自動完成。</p>
          </div>
          <div class="signature-header-actions">
            <span class="status-pill"><span id="pointCount">0</span> points</span>
            <button type="button" class="secondary" id="clearButton">清除</button>
          </div>
        </header>
        <div class="canvas-wrap">
          <canvas id="signatureCanvas"></canvas>
          <div class="placeholder" id="placeholder">SIGN</div>
        </div>
      </section>
    </main>

  </div>

  <script type="module">
    import { connectEvents, setDot, signHeaders } from "/assets/shared.js";

    const canvas = document.querySelector("#signatureCanvas");
    const ctx = canvas.getContext("2d");
    const placeholder = document.querySelector("#placeholder");
    const clearButton = document.querySelector("#clearButton");
    const message = document.querySelector("#message");
    const pointCount = document.querySelector("#pointCount");
    const connectionDot = document.querySelector("#connectionDot");
    const connectionText = document.querySelector("#connectionText");

    let strokes = [];
    let activeStroke = null;
    let drawing = false;
    let liveSignatureId = "";
    let liveFrame = 0;
    let liveDirty = false;
    let liveRequestInFlight = false;
    let liveAbortController = null;
    let finalizeTimer = null;
    let finalizing = false;
    const autoFinalizeDelayMs = 1300;

    function resizeCanvas() {
      const rect = canvas.getBoundingClientRect();
      const ratio = window.devicePixelRatio || 1;
      canvas.width = Math.max(1, Math.floor(rect.width * ratio));
      canvas.height = Math.max(1, Math.floor(rect.height * ratio));
      ctx.setTransform(ratio, 0, 0, ratio, 0, 0);
      ctx.lineCap = "round";
      ctx.lineJoin = "round";
      redraw();
    }

    function getPoint(event) {
      const rect = canvas.getBoundingClientRect();
      const x = (event.clientX - rect.left) / rect.width;
      const y = (event.clientY - rect.top) / rect.height;
      return {
        x: Math.min(1, Math.max(0, x)),
        y: Math.min(1, Math.max(0, y)),
        p: event.pressure || 0.5
      };
    }

    function drawStroke(stroke) {
      const rect = canvas.getBoundingClientRect();
      if (stroke.length < 2) return;
      ctx.beginPath();
      ctx.strokeStyle = "#171a20";
      ctx.lineWidth = 4;
      for (let i = 0; i < stroke.length; i += 1) {
        const point = stroke[i];
        const x = point.x * rect.width;
        const y = point.y * rect.height;
        if (i === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      }
      ctx.stroke();
    }

    function redraw() {
      const rect = canvas.getBoundingClientRect();
      ctx.clearRect(0, 0, rect.width, rect.height);
      for (const stroke of strokes) drawStroke(stroke);
      const points = strokes.reduce((sum, stroke) => sum + stroke.length, 0);
      pointCount.textContent = String(points);
      placeholder.style.display = points > 0 ? "none" : "grid";
    }

    canvas.addEventListener("pointerdown", (event) => {
      event.preventDefault();
      cancelAutoFinalize();
      ensureLiveSignatureId();
      drawing = true;
      activeStroke = [getPoint(event)];
      strokes.push(activeStroke);
      canvas.setPointerCapture(event.pointerId);
      redraw();
      pushLiveSignature(true);
    });

    canvas.addEventListener("pointermove", (event) => {
      if (!drawing || !activeStroke) return;
      event.preventDefault();
      activeStroke.push(getPoint(event));
      redraw();
      pushLiveSignature();
    });

    function finishStroke(event) {
      if (!drawing) return;
      event.preventDefault();
      drawing = false;
      activeStroke = null;
      redraw();
      pushLiveSignature(true);
      scheduleAutoFinalize();
    }

    canvas.addEventListener("pointerup", finishStroke);
    canvas.addEventListener("pointercancel", finishStroke);

    clearButton.addEventListener("click", () => {
      cancelAutoFinalize();
      cancelLiveFlush();
      strokes = [];
      activeStroke = null;
      finalizing = false;
      clearLiveSignature();
      liveSignatureId = "";
      message.textContent = "已清除，可以重新簽名。";
      redraw();
    });

    function ensureLiveSignatureId() {
      if (!liveSignatureId) {
        liveSignatureId = `sig-${Date.now()}-${Math.round(Math.random() * 10000)}`;
      }
    }

    function totalPoints() {
      return strokes.reduce((sum, stroke) => sum + stroke.length, 0);
    }

    function makePayload() {
      const rect = canvas.getBoundingClientRect();
      ensureLiveSignatureId();
      return {
        id: liveSignatureId,
        canvas: { width: rect.width, height: rect.height },
        strokes,
        meta: {
          doctorName: "",
          source: "ipad-sign-page",
          userAgent: navigator.userAgent
        }
      };
    }

    function pushLiveSignature(immediate = false) {
      if (totalPoints() < 1 || finalizing) return;
      liveDirty = true;
      if (immediate) flushLiveSignature();
      else scheduleLiveFlush();
    }

    function scheduleLiveFlush() {
      if (liveFrame || finalizing) return;
      liveFrame = requestAnimationFrame(() => {
        liveFrame = 0;
        flushLiveSignature();
      });
    }

    function cancelLiveFlush() {
      if (liveFrame) {
        cancelAnimationFrame(liveFrame);
        liveFrame = 0;
      }
      liveDirty = false;
      if (liveAbortController) {
        liveAbortController.abort();
        liveAbortController = null;
      }
    }

    function flushLiveSignature() {
      if (!liveDirty || totalPoints() < 1 || finalizing) return;
      if (liveRequestInFlight) return;
      liveDirty = false;
      sendLiveSignature();
    }

    async function sendLiveSignature() {
      if (totalPoints() < 1 || finalizing || liveRequestInFlight) return;
      liveRequestInFlight = true;
      liveAbortController = new AbortController();
      try {
        await fetch("/api/live-signature", {
          method: "POST",
          headers: { "Content-Type": "application/json", ...signHeaders() },
          body: JSON.stringify(makePayload()),
          signal: liveAbortController.signal
        });
        if (!drawing) message.textContent = "停筆中，準備自動完成...";
        else message.textContent = "正在同步到電視牆...";
      } catch (error) {
        if (error.name !== "AbortError") {
          message.textContent = `同步中斷：${error.message}`;
        }
      } finally {
        liveRequestInFlight = false;
        liveAbortController = null;
        if (liveDirty && !finalizing) scheduleLiveFlush();
      }
    }

    function scheduleAutoFinalize() {
      cancelAutoFinalize();
      if (totalPoints() < 2) return;
      finalizeTimer = setTimeout(finalizeSignature, autoFinalizeDelayMs);
    }

    function cancelAutoFinalize() {
      if (finalizeTimer) {
        clearTimeout(finalizeTimer);
        finalizeTimer = null;
      }
    }

    async function finalizeSignature() {
      if (finalizing || totalPoints() < 2) return;
      finalizing = true;
      cancelLiveFlush();
      message.textContent = "已完成，正在播放上牆動畫...";
      try {
        const response = await fetch("/api/signatures", {
          method: "POST",
          headers: { "Content-Type": "application/json", ...signHeaders() },
          body: JSON.stringify(makePayload())
        });
        const payload = await response.json();
        if (!response.ok) throw new Error(payload.error || "send failed");
        message.textContent = `已完成 ${payload.signatureId}，下一位可簽名。`;
        strokes = [];
        activeStroke = null;
        liveSignatureId = "";
      } catch (error) {
        message.textContent = `自動完成失敗：${error.message}`;
      } finally {
        finalizing = false;
        redraw();
      }
    }

    async function clearLiveSignature() {
      try {
        await fetch("/api/live-signature/clear", { method: "POST", headers: signHeaders() });
      } catch {
        // The local canvas still clears even if the wall is temporarily unreachable.
      }
    }

    connectEvents({
      connection(connected) {
        setDot(connectionDot, connected);
        connectionText.textContent = connected ? "已連線" : "連線中斷";
      }
    });

    window.addEventListener("resize", resizeCanvas);
    resizeCanvas();
  </script>
</body>
</html>
