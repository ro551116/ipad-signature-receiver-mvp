<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>醫師迎賓簽名牆</title>
  <link rel="stylesheet" href="/assets/app.css">
</head>
<body class="medical-wall-body">
  <main class="medical-stage" id="medicalStage" aria-label="醫師迎賓 LED 牆顯示端">
    <section class="medical-led" id="medicalLed">
      <div class="medical-standby" id="standbyLayer" aria-hidden="true"></div>
      <div class="medical-aurora" aria-hidden="true">
        <span class="aurora-ribbon ribbon-1"></span>
        <span class="aurora-ribbon ribbon-2"></span>
        <span class="aurora-ribbon ribbon-3"></span>
        <span class="aurora-ribbon ribbon-4"></span>
      </div>
      <video class="medical-aurora-video" id="auroraVideo" src="/assets/aurora-final.mp4" muted playsinline preload="auto" aria-hidden="true"></video>
      <canvas class="medical-aurora-burst" id="auroraBurst" aria-hidden="true"></canvas>
      <img class="medical-brand" src="/assets/nordberg-medical-logo-light.png" alt="Nordberg Medical">
      <div class="medical-arrival" id="arrivalLayer" aria-live="polite">
        <svg class="medical-signature" id="signatureSvg" viewBox="0 0 1000 500" preserveAspectRatio="xMidYMid meet" aria-label="醫師簽名">
          <path id="signaturePath"></path>
          <g id="strokeGroup"></g>
        </svg>
        <div class="medical-live-contact" id="liveContact" aria-hidden="true"></div>
        <div class="medical-current-label" id="currentLabel"></div>
      </div>
      <div class="medical-retained" id="retainedList" aria-label="已保留簽名"></div>
    </section>
    <div class="medical-status" id="statusText">standby / backplate animation</div>
  </main>

  <script type="module">
    import { connectEvents, formatTime, signatureToPath, signatureToStrokePaths } from "/assets/shared.js";

    const medicalStage = document.querySelector("#medicalStage");
    const medicalLed = document.querySelector("#medicalLed");
    const arrivalLayer = document.querySelector("#arrivalLayer");
    const signaturePath = document.querySelector("#signaturePath");
    const strokeGroup = document.querySelector("#strokeGroup");
    const liveContact = document.querySelector("#liveContact");
    const currentLabel = document.querySelector("#currentLabel");
    const retainedList = document.querySelector("#retainedList");
    const statusText = document.querySelector("#statusText");
    const marqueeDurations = [32000, 39000];
    const marqueeLaneCount = 4;
    let currentMode = "";
    // serverNow - local clock, refreshed from every full state. Reveal/exit
    // timing runs on server time so a wall PC with a drifting clock still
    // lines up with the server's return-to-marquee.
    let clockOffsetMs = 0;
    // id|activeSince of the final reveal on screen: unrelated broadcasts
    // during the display window must not restart it.
    let finalKey = "";
    // signaturesVersion the marquee was built from; rebuilding is the only
    // expensive DOM work here, so it happens only when the list changes.
    let marqueeVersion = null;

    function renderState(state) {
      if (!state) return;
      if (Number.isFinite(state.serverNow)) clockOffsetMs = state.serverNow - Date.now();
      medicalStage.classList.remove("blackout");

      if (state.liveSignature) {
        renderLiveSignature(state.liveSignature, state);
        return;
      }

      if (state.currentSignature) {
        renderFinalSignature(state.currentSignature, state);
        return;
      }

      renderMarquee(state);
      clearSignature(state.status || "idle");
    }

    // Live frames carry only the stroke being written (no retained list).
    function renderLiveFrame(frame) {
      if (!frame?.liveSignature) return;
      medicalStage.classList.remove("blackout");
      renderLiveSignature(frame.liveSignature, frame);
    }

    function renderLiveSignature(signature, state) {
      finalKey = "";
      strokeGroup.replaceChildren();
      arrivalLayer.style.animation = "";
      stopAuroraFx();
      const d = signatureToPath(signature);
      signaturePath.setAttribute("d", d);
      signaturePath.style.strokeDasharray = "";
      signaturePath.style.strokeDashoffset = "";
      setLiveContact(signature);
      setMode("live");

      currentLabel.textContent = "";
      statusText.textContent = `${state.status} / ${signature.meta?.doctorName || signature.id} / ${formatTime(signature.createdAt)}`;

      requestAnimationFrame(() => {
        medicalLed.classList.add("active");
      });
    }

    function renderFinalSignature(signature, state) {
      const key = `${signature.id}|${state.activeSince}`;
      if (key === finalKey && currentMode === "final") return;
      finalKey = key;

      signaturePath.removeAttribute("d");
      clearLiveContact();
      const elapsedMs = displayElapsedMs(state);
      buildStrokePlayback(signature);
      applyArrivalCycle(state, elapsedMs);
      startAuroraFx(elapsedMs);
      setMode("final", true);

      currentLabel.textContent = "";
      statusText.textContent = `${state.status} / ${signature.meta?.doctorName || signature.id} / ${formatTime(signature.createdAt)}`;

      requestAnimationFrame(() => {
        medicalLed.classList.add("active");
        arrivalLayer.classList.add("entering");
      });
    }

    // Signature is shown instantly, so the only thing this schedules is a
    // hold followed by a blur-out timed to land just before displayDurationMs
    // — which is kept at/under the aurora video's natural length so the
    // background is still playing (not frozen) when everything fades out.
    function applyArrivalCycle(state, elapsedMs) {
      const displayMs = Number(state?.displayDurationMs || 7800);
      const exitMs = 950;
      const holdMs = 400;
      const exitDelay = Math.max(holdMs, displayMs - exitMs - 150) - elapsedMs;

      arrivalLayer.style.animation = "none";
      void arrivalLayer.offsetWidth; // restart animations on replay
      arrivalLayer.style.animation =
        `medicalSignatureEnter 800ms cubic-bezier(0.19, 1, 0.22, 1) ${-elapsedMs}ms forwards, ` +
        `medicalSignatureExit ${exitMs}ms ease-in ${exitDelay}ms forwards`;
    }

    function clearSignature(nextStatus = "idle") {
      finalKey = "";
      signaturePath.removeAttribute("d");
      strokeGroup.replaceChildren();
      arrivalLayer.style.animation = "";
      stopAuroraFx();
      signaturePath.style.strokeDasharray = "";
      signaturePath.style.strokeDashoffset = "";
      clearLiveContact();
      setMode(nextStatus === "blackout" ? "blackout" : "marquee");
      currentLabel.textContent = "";
      medicalStage.classList.toggle("blackout", nextStatus === "blackout");
      statusText.textContent = nextStatus === "blackout" ? "blackout" : "standby / backplate animation";
    }

    function setMode(mode, force = false) {
      if (!force && currentMode === mode) return;
      currentMode = mode;
      medicalLed.classList.remove("active", "mode-marquee", "mode-live", "mode-final", "mode-blackout");
      arrivalLayer.classList.remove("entering");
      medicalLed.classList.add(`mode-${mode}`);
    }

    // The marquee is only visible in marquee mode (hidden by CSS otherwise),
    // so it is rebuilt from the newest signatures when that list changes.
    function renderMarquee(state) {
      if (state.signaturesVersion === marqueeVersion) return;
      marqueeVersion = state.signaturesVersion;
      syncMarqueeToClock();
      retainedList.replaceChildren();
      const recent = (state.recentSignatures || []).slice(-18);
      if (recent.length === 0) return;

      for (let laneIndex = 0; laneIndex < marqueeLaneCount; laneIndex += 1) {
        const lane = document.createElement("div");
        lane.className = `medical-marquee-lane lane-${laneIndex + 1}`;

        const track = document.createElement("div");
        track.className = "medical-marquee-track";

        for (const signature of repeatForLoop(rotateSignatures(recent, laneIndex), 8)) {
          track.append(createMarqueeItem(signature));
        }

        lane.append(track);
        retainedList.append(lane);
      }
    }

    function repeatForLoop(signatures, minimumHalfLength) {
      const half = [];
      while (half.length < minimumHalfLength) {
        half.push(...signatures);
      }
      return half.concat(half);
    }

    function rotateSignatures(signatures, offset) {
      const pivot = offset % signatures.length;
      return signatures.slice(pivot).concat(signatures.slice(0, pivot));
    }

    function createMarqueeItem(signature) {
      const item = document.createElement("article");
      item.className = "medical-retained-card";

      const label = document.createElement("span");
      label.textContent = signature.meta?.doctorName || signature.id;

      const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
      svg.setAttribute("viewBox", "0 0 1000 500");
      svg.setAttribute("preserveAspectRatio", "xMidYMid meet");

      const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
      path.setAttribute("d", signatureToPath(signature));
      svg.append(path);

      item.append(label, svg);
      return item;
    }

    // How far into the display window this wall is, in server time — a wall
    // opened mid-cue (or reconnecting) joins the reveal where it actually is.
    function displayElapsedMs(state) {
      const displayMs = Number(state?.displayDurationMs || 7800);
      const startedAt = state?.activeSince;
      const elapsedMs = Number.isFinite(startedAt) ? Date.now() + clockOffsetMs - startedAt : 0;
      return Math.min(Math.max(0, elapsedMs), Math.max(0, displayMs - 120));
    }

    // Shows the finished signature immediately (no stroke-by-stroke replay):
    // the arrivalLayer's own enter animation (scale + fade) is the only
    // reveal motion. Keeps final-mode short enough to fit inside the aurora
    // video's natural length instead of running past it.
    function buildStrokePlayback(signature) {
      strokeGroup.replaceChildren();
      for (const d of signatureToStrokePaths(signature)) {
        const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
        path.setAttribute("d", d);
        strokeGroup.append(path);
      }
    }

    function syncMarqueeToClock() {
      const now = Date.now();
      retainedList.style.setProperty("--marquee-delay-a", `${-(now % marqueeDurations[0])}ms`);
      retainedList.style.setProperty("--marquee-delay-b", `${-(now % marqueeDurations[1])}ms`);
    }

    function setLiveContact(signature) {
      const lastPoint = latestPoint(signature);
      if (!lastPoint) {
        clearLiveContact();
        return;
      }
      medicalLed.style.setProperty("--live-x", `${Math.round(lastPoint.x * 1000) / 10}%`);
      medicalLed.style.setProperty("--live-y", `${Math.round(lastPoint.y * 1000) / 10}%`);
      liveContact.hidden = false;
    }

    function clearLiveContact() {
      liveContact.hidden = true;
    }

    // ---- Final-mode aurora: generated video first, canvas fallback ---------

    const auroraVideo = document.querySelector("#auroraVideo");
    let auroraVideoReady = false;
    let videoStopTimer = null;

    auroraVideo.addEventListener("canplaythrough", () => { auroraVideoReady = true; });
    auroraVideo.addEventListener("error", () => { auroraVideoReady = false; });

    function startAuroraFx(elapsedMs = 0) {
      if (auroraVideoReady) {
        if (videoStopTimer) {
          clearTimeout(videoStopTimer);
          videoStopTimer = null;
        }
        stopAuroraBurst();
        // No loop attribute (plays once, then holds the last frame): a late
        // joiner past the video's natural end just sees that held frame
        // instead of a modulo-wrapped restart.
        const duration = auroraVideo.duration || 0;
        if (duration > 0) {
          auroraVideo.currentTime = Math.min(elapsedMs / 1000, duration);
        }
        auroraVideo.play().catch(() => {
          // Autoplay refused (shouldn't happen for muted video): use canvas.
          auroraVideoReady = false;
          startAuroraBurst(elapsedMs);
        });
        medicalLed.classList.add("has-aurora-video");
        return;
      }
      medicalLed.classList.remove("has-aurora-video");
      startAuroraBurst(elapsedMs);
    }

    // Matches the 1300ms opacity transition on .medical-aurora-video /
    // .medical-aurora-burst in app.css, plus a small margin.
    const auroraFadeMs = 1300;

    function stopAuroraFx() {
      stopAuroraBurst();
      if (!auroraVideo.paused) {
        // Let the CSS opacity fade-out finish before pausing playback.
        if (videoStopTimer) clearTimeout(videoStopTimer);
        videoStopTimer = setTimeout(() => {
          auroraVideo.pause();
          videoStopTimer = null;
        }, auroraFadeMs + 100);
      }
    }

    const burstCanvas = document.querySelector("#auroraBurst");
    const burstCtx = burstCanvas.getContext("2d");
    // Bands render into a low-res offscreen canvas, then get composited with
    // a blur so the columns melt into silky aurora veils.
    const bandCanvas = document.createElement("canvas");
    const bandCtx = bandCanvas.getContext("2d");
    let burstRaf = null;
    let burstStartTime = 0;
    let burstClearTimer = null;

    // Sweeping aurora bands arcing across the sky (reference: aurora borealis
    // over water), with bright lower edges, upward rays, stars and a
    // reflection glow near the bottom of the wall.
    const AURORA_RIBBONS = [
      { color: [96, 250, 200], alpha: 0.58, baseY: 0.42, ampY: 0.16, speed: 0.28, rayLen: 0.5, rayFreq: 9, phase: 0.8 },
      { color: [70, 226, 200], alpha: 0.42, baseY: 0.56, ampY: 0.12, speed: -0.2, rayLen: 0.4, rayFreq: 6, phase: 3.6 },
      { color: [96, 198, 255], alpha: 0.24, baseY: 0.3, ampY: 0.09, speed: 0.15, rayLen: 0.32, rayFreq: 4.5, phase: 5.2 }
    ];
    let burstStars = [];

    function startAuroraBurst(elapsedMs = 0) {
      stopAuroraBurst();
      if (burstClearTimer) {
        clearTimeout(burstClearTimer);
        burstClearTimer = null;
      }
      const box = burstCanvas.getBoundingClientRect();
      burstCanvas.width = Math.max(2, Math.round(box.width / 2));
      burstCanvas.height = Math.max(2, Math.round(box.height / 2));
      bandCanvas.width = Math.max(2, Math.round(box.width / 4));
      bandCanvas.height = Math.max(2, Math.round(box.height / 4));
      burstStars = Array.from({ length: Math.round(burstCanvas.width / 7) }, () => ({
        x: Math.random() * burstCanvas.width,
        y: Math.random() * burstCanvas.height * 0.72,
        r: 0.6 + Math.random() * 1.2,
        tw: Math.random() * Math.PI * 2,
        spd: 0.4 + Math.random() * 1.6
      }));
      burstStartTime = performance.now() - elapsedMs;
      burstRaf = requestAnimationFrame(drawAuroraBurst);
    }

    function stopAuroraBurst() {
      if (burstRaf) {
        cancelAnimationFrame(burstRaf);
        burstRaf = null;
        // Keep the last frame visible while the CSS opacity fade-out runs.
        burstClearTimer = setTimeout(() => {
          burstCtx.clearRect(0, 0, burstCanvas.width, burstCanvas.height);
          burstClearTimer = null;
        }, auroraFadeMs + 100);
      }
    }

    function drawAuroraBurst(now) {
      const t = (now - burstStartTime) / 1000;
      const w = bandCanvas.width;
      const h = bandCanvas.height;
      const ramp = Math.min(1, t / (auroraFadeMs / 1000)); // intensity ramp-in, synced to the CSS fade

      bandCtx.clearRect(0, 0, w, h);
      bandCtx.globalCompositeOperation = "lighter";

      const step = Math.max(2, Math.round(w / 200));
      const horizon = h * 0.9;
      const reflection = [];

      for (const [ribbonIndex, ribbon] of AURORA_RIBBONS.entries()) {
        const [r, g, b] = ribbon.color;
        for (let x = 0; x <= w; x += step) {
          const u = x / w;
          // large sweeping S-curves arcing across the sky
          const curve =
            Math.sin(u * 2.4 + t * ribbon.speed + ribbon.phase) * 0.62 +
            Math.sin(u * 5.1 - t * ribbon.speed * 0.7 + ribbon.phase * 1.7) * 0.38;
          const spine = h * (ribbon.baseY + ribbon.ampY * curve);

          // gentle brightness variation along the band: silk, not pickets
          const ray =
            (Math.sin(u * ribbon.rayFreq * Math.PI + t * ribbon.speed * 2.2 + ribbon.phase) * 0.5 + 0.5) * 0.65 +
            (Math.sin(u * ribbon.rayFreq * 2.3 * Math.PI - t * ribbon.speed * 1.4) * 0.5 + 0.5) * 0.35;
          const alpha = ribbon.alpha * ramp * (0.5 + 0.5 * ray);

          // tall soft veil rising from the band
          const rayH = h * ribbon.rayLen * (0.75 + 0.25 * Math.sin(u * 2.7 + t * 0.4 + ribbon.phase)) * (0.7 + 0.3 * ray);
          const up = bandCtx.createLinearGradient(0, spine, 0, spine - rayH);
          up.addColorStop(0, `rgba(${r}, ${g}, ${b}, ${alpha})`);
          up.addColorStop(0.25, `rgba(${r}, ${g}, ${b}, ${alpha * 0.55})`);
          up.addColorStop(0.65, `rgba(${r}, ${g}, ${b}, ${alpha * 0.2})`);
          up.addColorStop(1, "rgba(0, 0, 0, 0)");
          bandCtx.fillStyle = up;
          bandCtx.fillRect(x, spine - rayH, step + 1, rayH);

          // bright leading edge melting downward, like the reference photo
          const edgeH = h * 0.1;
          const edge = bandCtx.createLinearGradient(0, spine, 0, spine + edgeH);
          edge.addColorStop(0, `rgba(${Math.min(255, r + 120)}, ${Math.min(255, g + 40)}, ${Math.min(255, b + 60)}, ${alpha * 0.8})`);
          edge.addColorStop(0.35, `rgba(${r}, ${g}, ${b}, ${alpha * 0.3})`);
          edge.addColorStop(1, "rgba(0, 0, 0, 0)");
          bandCtx.fillStyle = edge;
          bandCtx.fillRect(x, spine, step + 1, edgeH);

          if (ribbonIndex === 0) reflection.push({ x, alpha });
        }
      }

      // soft water-like reflection glow near the bottom edge
      for (const column of reflection) {
        const glow = bandCtx.createLinearGradient(0, horizon, 0, h);
        glow.addColorStop(0, `rgba(86, 235, 205, ${column.alpha * 0.22})`);
        glow.addColorStop(1, "rgba(86, 235, 205, 0)");
        bandCtx.fillStyle = glow;
        bandCtx.fillRect(column.x, horizon, step + 1, h - horizon);
      }

      // composite: blurred bands first, then crisp twinkling stars
      const mainW = burstCanvas.width;
      const mainH = burstCanvas.height;
      burstCtx.clearRect(0, 0, mainW, mainH);
      burstCtx.globalCompositeOperation = "lighter";
      burstCtx.filter = `blur(${Math.max(2, Math.round(mainW / 320))}px)`;
      burstCtx.drawImage(bandCanvas, 0, 0, mainW, mainH);
      burstCtx.filter = "none";

      for (const star of burstStars) {
        const twinkle = 0.3 + 0.7 * (0.5 + 0.5 * Math.sin(t * star.spd + star.tw));
        burstCtx.fillStyle = `rgba(225, 245, 255, ${0.75 * twinkle * ramp})`;
        burstCtx.fillRect(star.x, star.y, star.r, star.r);
      }

      burstCtx.globalCompositeOperation = "source-over";
      burstRaf = requestAnimationFrame(drawAuroraBurst);
    }

    function latestPoint(signature) {
      const strokes = signature?.strokes || [];
      for (let i = strokes.length - 1; i >= 0; i -= 1) {
        const stroke = strokes[i] || [];
        if (stroke.length > 0) return stroke[stroke.length - 1];
      }
      return null;
    }

    connectEvents("wall", {
      connection(connected) {
        statusText.dataset.connected = connected ? "true" : "false";
      },
      state: renderState,
      "signature:live": renderLiveFrame,
      "signature:live-clear": renderState,
      "signature:submitted": renderState,
      "signature:removed": renderState,
      "cue:reset": renderState,
      "cue:idle": renderState,
      "cue:auto-idle": renderState,
      "cue:blackout": renderState,
      "cue:clear-signatures": renderState
    });
  </script>
</body>
</html>
